# Nginx sample — IFS Industrial ERP V15

# /etc/nginx/sites-available/ifs-erp

upstream ifs_erp {
    server 127.0.0.1:8501;
}

upstream ifs_portal {
    server 127.0.0.1:8502;
}

server {
    listen 80;
    server_name ifschemicals.com www.ifschemicals.com 138.201.139.157;
    return 301 https://ifschemicals.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ifschemicals.com www.ifschemicals.com;

    # Let's Encrypt (certbot -d ifschemicals.com -d www.ifschemicals.com)
    ssl_certificate     /etc/letsencrypt/live/ifschemicals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ifschemicals.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Block database and sensitive files
    location ~* \.(db|sqlite|sql|bak|env)$ {
        deny all;
        return 404;
    }

    # Distributor portal
    location /portal/ {
        proxy_pass http://ifs_portal/portal/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Internal ERP
    location / {
        proxy_pass http://ifs_erp/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
